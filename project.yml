name: VolumeDownFloater
options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    iOS: "14.0"
targets:
  VolumeDownFloater:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: GeneratedInfo.plist
      properties:
        CFBundleDisplayName: VolDown
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
          - picture-in-picture
    settings:
      base:
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_ENTITLEMENTS: Sources/App.entitlements
        ENABLE_BITCODE: "NO"