name: Build Jailbreak Deb

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: kohler/theos-action@master

      - name: Install ldid
        run: brew install ldid

      - name: Compile Deb
        run: |
          make package FINALPACKAGE=1

      - name: Upload Deb
        uses: actions/upload-artifact@v4
        with:
          name: VolumeDown-Deb
          path: packages/*.deb