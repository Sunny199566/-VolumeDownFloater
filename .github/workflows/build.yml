name: Build TrollFools Dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Dylib
        run: |
          xcodebuild build \
            -project VolumeDownFloater.xcodeproj \
            -scheme VolumeDownFloater \
            -sdk iphoneos \
            -configuration Release \
            CONFIGURATION_BUILD_DIR=./output \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package into Zip
        run: |
          cp output/VolumeDownFloater.framework/VolumeDownFloater output/VolumeDownFloater.dylib
          cd output
          zip VolumeDownFloater.zip VolumeDownFloater.dylib

      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: TrollFools-Dylib
          path: output/VolumeDownFloater.zip