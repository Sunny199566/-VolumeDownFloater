name: Build Jailbreak Deb

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Theos Manually
        run: |
          brew install ldid xz make dpkg
          export THEOS="${{ github.workspace }}/theos"
          git clone --recursive https://github.com/theos/theos.git $THEOS
          curl -LO https://codeload.github.com/theos/sdks/zip/refs/heads/master
          unzip -q master
          mkdir -p $THEOS/sdks
          mv sdks-master/*.sdk $THEOS/sdks/
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Compile Deb
        run: |
          make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1

      - name: Upload Deb
        uses: actions/upload-artifact@v4
        with:
          name: VolumeDown-Deb
          path: packages/*.deb