name: Build TrollStore IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project VolumeDownFloater.xcodeproj \
            -scheme VolumeDownFloater \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package into IPA
        run: |
          mkdir -p $RUNNER_TEMP/Payload
          cp -R $RUNNER_TEMP/App.xcarchive/Products/Applications/VolumeDownFloater.app $RUNNER_TEMP/Payload/
          cd $RUNNER_TEMP
          zip -r VolumeDownFloater.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TrollStore-VolumeDown-IPA
          path: $RUNNER_TEMP/VolumeDownFloater.ipa
